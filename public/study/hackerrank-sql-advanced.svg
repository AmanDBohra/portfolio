<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="SQL (Advanced) concept diagram">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0a2135"/><stop offset="1" stop-color="#0b2740"/></linearGradient>
<radialGradient id="glow" cx="0.8" cy="0.1" r="0.9">
<stop offset="0" stop-color="#de5c30" stop-opacity="0.25"/><stop offset="1" stop-color="#de5c30" stop-opacity="0"/></radialGradient>
</defs>
<rect width="800" height="450" fill="url(#bg)"/>
<rect width="800" height="450" fill="url(#glow)"/>
<rect x="60" y="120" width="180" height="120" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#e97c54" stroke-opacity="0.5"/>
<text x="80" y="145" font-family="Inter,Arial" font-size="14" fill="#e97c54">orders</text>
<line x1="90" y1="155" x2="220" y2="155" stroke="#e97c54" stroke-opacity="0.3"/>
<text x="80" y="175" font-family="Inter,Arial" font-size="12" fill="#9fb2c4">order_id</text>
<text x="80" y="195" font-family="Inter,Arial" font-size="12" fill="#9fb2c4">customer_id</text>
<text x="80" y="215" font-family="Inter,Arial" font-size="12" fill="#9fb2c4">amount</text>
<rect x="340" y="120" width="180" height="120" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#18a6a6" stroke-opacity="0.5"/>
<text x="360" y="145" font-family="Inter,Arial" font-size="14" fill="#18a6a6">customers</text>
<line x1="350" y1="155" x2="500" y2="155" stroke="#18a6a6" stroke-opacity="0.3"/>
<text x="360" y="175" font-family="Inter,Arial" font-size="12" fill="#9fb2c4">customer_id</text>
<text x="360" y="195" font-family="Inter,Arial" font-size="12" fill="#9fb2c4">name</text>
<text x="360" y="215" font-family="Inter,Arial" font-size="12" fill="#9fb2c4">country</text>
<path d="M240 180 L340 180" stroke="#e97c54" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="255" y="172" font-family="Inter,Arial" font-size="11" fill="#e97c54">JOIN on customer_id</text>
<rect x="60" y="280" width="460" height="110" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#46c7e8" stroke-opacity="0.35"/>
<text x="80" y="305" font-family="monospace" font-size="12" fill="#e97c54">SELECT c.name, SUM(o.amount)</text>
<text x="80" y="325" font-family="monospace" font-size="12" fill="#e8eef5">FROM orders o JOIN customers c</text>
<text x="80" y="345" font-family="monospace" font-size="12" fill="#e8eef5">  ON o.customer_id = c.customer_id</text>
<text x="80" y="365" font-family="monospace" font-size="12" fill="#18a6a6">GROUP BY c.name HAVING SUM(o.amount) &gt; 1000</text>
<text x="40" y="410" font-family="Inter,Arial" font-weight="700" font-size="26" fill="#e8eef5">SQL (Advanced)</text>
<text x="40" y="436" font-family="Inter,Arial" font-size="15" fill="#9fb2c4">Joins · Window Functions · Subqueries · Optimization</text>
</svg>
