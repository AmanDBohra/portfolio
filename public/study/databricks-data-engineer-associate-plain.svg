<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a2135"/><stop offset="1" stop-color="#0b2740"/></linearGradient>
<marker id="arw" markerWidth="12" markerHeight="12" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#46c7e8"/></marker></defs>
<rect width="1000" height="460" fill="url(#bg)"/><text x="40" y="50" font-size="24" font-weight="700" fill="#e8eef5">Databricks Data Engineer Associate</text><text x="40" y="78" font-size="15" fill="#9fb2c4">In plain English — everyday analogy → what it really is</text><text x="60" y="118" font-size="13" font-weight="700" fill="#46c7e8" letter-spacing="1.5">EVERYDAY ANALOGY</text><text x="560" y="118" font-size="13" font-weight="700" fill="#18a6a6" letter-spacing="1.5">WHAT IT REALLY IS</text><rect x="60" y="140" width="420" height="68" rx="12" fill="#2386c8" fill-opacity="0.12" stroke="#46c7e8" stroke-opacity="0.35"/><text x="78" y="179.0" font-size="14.5" fill="#e8eef5">A restaurant kitchen: raw → washed → plated</text><path d="M 492 174.0 L 546 174.0" stroke="#46c7e8" stroke-width="3" marker-end="url(#arw)"/><rect x="560" y="140" width="400" height="68" rx="12" fill="#18a6a6" fill-opacity="0.12" stroke="#18a6a6" stroke-opacity="0.4"/><text x="578" y="169.5" font-size="14.5" fill="#e8eef5">Medallion: Bronze (raw) → Silver (clean) → Gold</text><text x="578" y="188.5" font-size="14.5" fill="#e8eef5">(ready)</text><rect x="60" y="222" width="420" height="68" rx="12" fill="#2386c8" fill-opacity="0.12" stroke="#46c7e8" stroke-opacity="0.35"/><text x="78" y="261.0" font-size="14.5" fill="#e8eef5">Google Docs with full undo history</text><path d="M 492 256.0 L 546 256.0" stroke="#46c7e8" stroke-width="3" marker-end="url(#arw)"/><rect x="560" y="222" width="400" height="68" rx="12" fill="#18a6a6" fill-opacity="0.12" stroke="#18a6a6" stroke-opacity="0.4"/><text x="578" y="261.0" font-size="14.5" fill="#e8eef5">Delta Lake: versions, time travel, ACID</text><rect x="60" y="304" width="420" height="68" rx="12" fill="#2386c8" fill-opacity="0.12" stroke="#46c7e8" stroke-opacity="0.35"/><text x="78" y="343.0" font-size="14.5" fill="#e8eef5">A pet you own vs an apartment you rent</text><path d="M 492 338.0 L 546 338.0" stroke="#46c7e8" stroke-width="3" marker-end="url(#arw)"/><rect x="560" y="304" width="400" height="68" rx="12" fill="#18a6a6" fill-opacity="0.12" stroke="#18a6a6" stroke-opacity="0.4"/><text x="578" y="333.5" font-size="14.5" fill="#e8eef5">Managed table (drop deletes data) vs External</text><text x="578" y="352.5" font-size="14.5" fill="#e8eef5">(files stay)</text><rect x="60" y="386" width="420" height="68" rx="12" fill="#2386c8" fill-opacity="0.12" stroke="#46c7e8" stroke-opacity="0.35"/><text x="78" y="425.0" font-size="14.5" fill="#e8eef5">A mailbox that reads only new letters</text><path d="M 492 420.0 L 546 420.0" stroke="#46c7e8" stroke-width="3" marker-end="url(#arw)"/><rect x="560" y="386" width="400" height="68" rx="12" fill="#18a6a6" fill-opacity="0.12" stroke="#18a6a6" stroke-opacity="0.4"/><text x="578" y="425.0" font-size="14.5" fill="#e8eef5">Auto Loader: incremental file ingestion</text></svg>